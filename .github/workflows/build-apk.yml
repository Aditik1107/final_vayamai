name: Build Android APK (Client & Trainer App)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'apps/mobile/package.json'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Mobile Dependencies
        run: |
          cd apps/mobile
          npm install --legacy-peer-deps

      - name: Generate React Native Android Template (if needed)
        run: |
          cd apps/mobile
          if [ ! -d "android" ]; then
            echo "Generating android native project template..."
            npx @react-native-community/cli init TempApp --version 0.74.1 --skip-install --npm
            cp -r TempApp/android ./android
            rm -rf TempApp
          fi

      - name: Bundle React Native JavaScript
        run: |
          cd apps/mobile
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/

      - name: Build Android Release APK
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          find apps/mobile/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/VyayamAI-Integrated-App.apk \;
          ls -lh build-output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VyayamAI-Integrated-App-APK
          path: build-output/VyayamAI-Integrated-App.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/VyayamAI-Integrated-App.apk
          tag_name: v1.0.0-apk
          name: "VyayamAI Integrated App APK (Client & Trainer)"
          body: |
            ### 📱 VyayamAI Integrated Android App
            This APK includes both **Client** and **Trainer** portals:
            - **Client Portal**: Vision-based Meal AI, daily nutrition, workout routine check-off, BMI and lab report tracking.
            - **Trainer Portal**: Client rosters, Gemini AI daily briefings, dropout alerts, routine planner.
            - **Live Database**: Connected to the shared Supabase PostgreSQL backend.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
